[package]
name = "ascii-image-generator"
version = "0.1.0"
edition = "2021"
description = "ASCII Image Generator"

[dependencies]
eframe = "0.32"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
jpeg-decoder = { version = "0.3", default-features = false }
rfd = "0.15"
resvg = "0.45"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "ClipboardEvent",
    "DataTransfer",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "Window",
] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
