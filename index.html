<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cosmic Archive — ASCII</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050508;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #still-input {
        position: absolute;
        width: 0;
        height: 0;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <input
      id="still-input"
      type="file"
      accept="image/*,.svg,.png,.jpg,.jpeg,.webp,.gif,.bmp,.tif,.tiff"
    />
    <canvas id="the_canvas_id"></canvas>
    <link data-trunk rel="rust" data-wasm-opt="0" />
  </body>
</html>
